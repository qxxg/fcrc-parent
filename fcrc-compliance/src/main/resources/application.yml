server:
  port: ${SERVER_PORT:8083}
  shutdown: graceful

spring:
  application:
    name: fcrc-compliance
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.fcrc: INFO

# 演示数据开关。显式映射环境变量，避免宽松绑定无法命中 fcrc.demo-data.enabled。
fcrc:
  demo-data:
    enabled: ${FCRC_DEMO_DATA_ENABLED:true}
