# Docker / 测试服务器：MySQL + Nacos，服务间使用 Compose 服务名。
spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:mysql}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:fcrc}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
    username: ${MYSQL_USERNAME:fcrc}
    password: ${MYSQL_PASSWORD:fcrc_pass}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  cloud:
    nacos:
      discovery:
        enabled: true
        register-enabled: true
        server-addr: ${NACOS_SERVER_ADDR:nacos:8848}
        namespace: ${NACOS_NAMESPACE:public}
        group: ${NACOS_GROUP:DEFAULT_GROUP}

fcrc:
  clients:
    customer:
      base-url: ${CUSTOMER_URL:http://fcrc-customer:8081}
    risk:
      base-url: ${RISK_URL:http://fcrc-risk:8082}
    compliance:
      base-url: ${COMPLIANCE_URL:http://fcrc-compliance:8083}
    cases:
      base-url: ${CASE_URL:http://fcrc-case:8086}
    report:
      base-url: ${REPORT_URL:http://fcrc-report:8087}
    connect-timeout: 3s
    read-timeout: 15s
