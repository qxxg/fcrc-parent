server:
  port: ${SERVER_PORT:8084}
  shutdown: graceful

spring:
  application:
    name: fcrc-workflow
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.fcrc: INFO
    com.alibaba.cloud.ai.graph: INFO
    org.hibernate.SQL: WARN
