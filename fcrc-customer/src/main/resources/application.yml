server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful

spring:
  application:
    name: fcrc-customer
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.fcrc: INFO
    org.hibernate.SQL: WARN

# 演示数据开关。显式映射环境变量，避免 Spring 宽松绑定把
# FCRC_DEMO_DATA_ENABLED 解析成 fcrc.demo.data.enabled 而无法命中 fcrc.demo-data.enabled。
fcrc:
  demo-data:
    enabled: ${FCRC_DEMO_DATA_ENABLED:true}
