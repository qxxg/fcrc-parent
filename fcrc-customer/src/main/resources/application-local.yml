# 本地开发：零外部依赖，H2 文件库保证重启后数据仍在。
spring:
  datasource:
    url: jdbc:h2:file:./data/customer;MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console
  cloud:
    nacos:
      discovery:
        enabled: false
        register-enabled: false
